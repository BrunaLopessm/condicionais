<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicionais</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="container">
        <h1>Verificar aprovação</h1>
 
        <label>Digite a sua nota</label>
        <input type="number" id="nota">
 
        <button onclick="verificar()">Verificar</button>
        <p id="resultado"></p>
 
    </section>

    <section class="container">
        <h1>Diferença de valores</h1>
 
        <label>Digite um número</label>
        <input type="number" id="numero01">

        <label>Digite outro número</label>
        <input type="number" id="numero02">
 
        <button onclick="diferenca()">Verificar</button>
        <p id="resultado02"></p>
 
    </section>

     <section class="container">
        <h1>Média de 4 notas</h1>
 
        <label>Digite sua nota</label>
        <input type="number" id="n1">

        <label>Digite sua nota</label>
        <input type="number" id="n2">

        <label>Digite sua nota</label>
        <input type="number" id="n3">

        <label>Digite sua nota</label>
        <input type="number" id="n4">
 
        <button onclick="media()">Verificar</button>
        <p id="md"></p>
 
    </section>

    
    <script src="js/script.js"></script>
</body>
</html>
